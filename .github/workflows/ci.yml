name: Student App CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: flutter --version

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: |
          set +e
          flutter pub get > /tmp/flutter_output.log 2>&1
          EXIT_CODE=$?
          grep -E "(warning|error|WARNING|ERROR|FAILED)" /tmp/flutter_output.log || echo "No warnings or errors found"
          exit $EXIT_CODE

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool
            .flutter-plugins
            .flutter-plugins-dependencies
            .packages
            pubspec.lock
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Generate code
        run: |
          set +e
          dart run build_runner build --delete-conflicting-outputs > /tmp/build_runner_output.log 2>&1
          EXIT_CODE=$?
          grep -E "(warning|error|WARNING|ERROR|FAILED)" /tmp/build_runner_output.log || echo "No warnings or errors found"
          exit $EXIT_CODE

      - name: Run Flutter analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/analyze_output.log 2>&1
          EXIT_CODE=$?
          grep -E "(warning|error|WARNING|ERROR|FAILED|issue)" /tmp/analyze_output.log || echo "No warnings or errors found"
          exit $EXIT_CODE

      - name: Run Flutter tests
        run: |
          set +e
          flutter test --reporter expanded > /tmp/test_output.log 2>&1
          EXIT_CODE=$?
          grep -E "(warning|error|WARNING|ERROR|FAILED|✗|FAIL|Exception)" /tmp/test_output.log || echo "No warnings or errors found"
          exit $EXIT_CODE

      - name: Build APK (Release)
        run: |
          set +e
          flutter build apk --release --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'https://apitutor.dienluc.vn' }} --dart-define=ENVIRONMENT=production > /tmp/build_output.log 2>&1
          EXIT_CODE=$?
          grep -E "(warning|error|WARNING|ERROR|FAILED)" /tmp/build_output.log || echo "No warnings or errors found"
          exit $EXIT_CODE

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

